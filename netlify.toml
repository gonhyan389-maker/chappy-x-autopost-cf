[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."run-scheduler"]
  schedule = "*/15 * * * *"

# 20:30 JST = 11:30 UTC
[functions."run-note-autopost"]
  schedule = "30 11 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
