name = "chappy-x-autopost-cf"
main = "src/index.js"
compatibility_date = "2026-09-04"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "APP_STATE"
class_name = "AppState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppState"]

[triggers]
crons = ["*/15 * * * *"]
